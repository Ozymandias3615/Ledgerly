name: Build Windows Installer

# Builds the Windows installer on a real Windows runner (no wine needed) and
# attaches it to the matching GitHub release whenever a version tag is pushed.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and upload to (e.g. v0.1.3)"
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # --legacy-peer-deps: react-day-picker's date-fns peer range (^2/^3) is
        # older than the pinned date-fns@4, which npm ci otherwise rejects.
        run: npm ci --legacy-peer-deps

      - name: Build Windows installer
        # CI=false: CRA treats lint warnings as build failures when CI is set
        # (which GitHub Actions does automatically); the local build only warns.
        run: npm run electron:pack
        env:
          CI: false

      - name: Resolve release tag
        id: vars
        shell: bash
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Upload installer to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          files: frontend/dist/*Setup*.exe
