services:
  - type: web
    name: ledgerly-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DB_NAME
        value: ledgerly
      - key: FIREBASE_PROJECT_ID
        value: ledgerly-98458
      # Org slug isn't a secret (it's the same "ledgerly-et" visible in any
      # Sentry issue URL for this project) - the auth token below is what's
      # actually sensitive.
      - key: SENTRY_ORG_SLUG
        value: ledgerly-et
      # VAPID_PUBLIC_KEY/VAPID_SUBJECT aren't secrets - the public key is
      # handed to every browser that subscribes to push anyway - so they're
      # committed directly rather than set in the dashboard like the keys below.
      - key: VAPID_PUBLIC_KEY
        value: BNax6Z7f21l9quz5to5qszmm_J9Ht3K4mFZytiNRZPuChHmBYtqT6oXaz7wFT2SZfg7R96kwbbUXUmHPgHE8vwM
      - key: VAPID_SUBJECT
        value: mailto:n.abbiw10@gmail.com
      # Secrets - set these in the Render dashboard, never committed to git
      - key: JWT_SECRET
        sync: false
      - key: MONGO_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MOBILE_URL
        sync: false
      - key: PULSE_URL
        sync: false
      - key: ADMIN_URL
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_AUTH_TOKEN
        sync: false

  - type: web
    name: ledgerly-mobile
    runtime: static
    rootDir: mobile
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://ledgerly-api-qij7.onrender.com
      - key: VITE_FIREBASE_API_KEY
        value: AIzaSyCxKinW70GNB41emSDgvdtqQPXkppgcO7I
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: ledgerly-98458.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: ledgerly-98458
      - key: VITE_FIREBASE_APP_ID
        value: 1:129649921204:web:e06edaaddcf550c5465be1
      - key: VITE_GOOGLE_CLIENT_ID
        value: 129649921204-uu2ol3vak73mltqd3t4sdnsf095tir5k.apps.googleusercontent.com
      - key: VITE_SENTRY_DSN
        value: https://ee572d901530290ef6169ed84a7297fd@o4511870539661312.ingest.us.sentry.io/4511870664507392
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: ledgerly-admin
