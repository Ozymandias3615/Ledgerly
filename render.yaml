services:
  - type: web
    name: ledgerly-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DB_NAME
        value: ledgerly
      - key: FIREBASE_PROJECT_ID
        value: ledgerly-98458
      # Secrets - set these in the Render dashboard, never committed to git
      - key: JWT_SECRET
        sync: false
      - key: MONGO_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MOBILE_URL
        sync: false

  - type: static
    name: ledgerly-mobile
    rootDir: mobile
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://ledgerly-api-qij7.onrender.com
      - key: VITE_FIREBASE_API_KEY
        value: AIzaSyCxKinW70GNB41emSDgvdtqQPXkppgcO7I
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: ledgerly-98458.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: ledgerly-98458
      - key: VITE_FIREBASE_APP_ID
        value: 1:129649921204:web:e06edaaddcf550c5465be1
      - key: VITE_GOOGLE_CLIENT_ID
        value: 129649921204-uu2ol3vak73mltqd3t4sdnsf095tir5k.apps.googleusercontent.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
